name: Analyze Syrian Medicine Master Merge

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dr-alhasan
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify source files
        shell: bash
        run: |
          set -euo pipefail

          test -f "syrian_drug_master_v1.csv" || {
            echo "ERROR: syrian_drug_master_v1.csv not found in repository root."
            exit 1
          }

          test -f "temp/syrian_drugs_chunks/MANIFEST.txt" || {
            echo "ERROR: chunk manifest not found."
            exit 1
          }

          echo "Source files verified."

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p temp/merge_analysis/output

          cp "syrian_drug_master_v1.csv" \
             "temp/merge_analysis/syrian_drug_master_v1.csv"

          find temp/syrian_drugs_chunks \
            -maxdepth 1 \
            -name 'part_*.csv' \
            -print \
            | sort \
            > temp/merge_analysis/chunks.txt

          count=$(wc -l < temp/merge_analysis/chunks.txt)

          echo "Chunk count: $count"

          test "$count" -eq 23 || {
            echo "ERROR: Expected 23 chunks, found $count."
            exit 1
          }

      - name: Create merge analyzer
        shell: bash
        run: |
          set -euo pipefail

          cat > temp/merge_analysis/analyze.py <<'PY'
          import csv
          import json
          import re
          import unicodedata
          from collections import defaultdict, Counter

          ROOT = "temp/merge_analysis"
          OUT = f"{ROOT}/output"

          SOURCE1 = f"{ROOT}/syrian_drug_master_v1.csv"

          CHUNK_DIR = "temp/syrian_drugs_chunks"

          # ------------------------------------------------------------
          # Normalization
          # ------------------------------------------------------------

          ARABIC_RE = re.compile(r"[\u0600-\u06FF]")
          LATIN_RE = re.compile(r"[A-Za-z]")

          def clean(value):
              if value is None:
                  return ""
              value = str(value).strip()
              value = unicodedata.normalize("NFKC", value)
              value = re.sub(r"\s+", " ", value)
              return value.strip()

          def norm(value):
              value = clean(value).lower()

              replacements = {
                  "µ": "u",
                  "μ": "u",
                  "×": "x",
                  "–": "-",
                  "—": "-",
                  "−": "-",
                  "،": ",",
                  "؛": ";",
              }

              for a, b in replacements.items():
                  value = value.replace(a, b)

              # Normalize common Arabic variants only for comparison.
              value = value.replace("أ", "ا")
              value = value.replace("إ", "ا")
              value = value.replace("آ", "ا")
              value = value.replace("ى", "ي")
              value = value.replace("ة", "ه")

              value = re.sub(r"\s+", " ", value)

              return value.strip()

          def compact(value):
              return re.sub(r"[^a-z0-9\u0600-\u06FF]+", "", norm(value))

          def has_arabic(value):
              return bool(ARABIC_RE.search(clean(value)))

          def has_latin(value):
              return bool(LATIN_RE.search(clean(value)))

          # ------------------------------------------------------------
          # Ingredient / strength normalization
          # ------------------------------------------------------------

          def split_plus(value):
              value = clean(value)

              if not value:
                  return []

